<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exporter copie TEST</title><style>body{font-family:system-ui;background:#f4f6f8;color:#17212b;margin:0}main{max-width:700px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:20px}.btn{background:#203a5f;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}.muted{color:#667085}.notice{padding:10px;background:#fff8eb;border-left:4px solid #a66100;border-radius:8px}</style></head><body><main><div class="card"><h1>Exporter une copie TEST</h1><p class="muted">Cet outil lit la production et télécharge un JSON local. Il n’exporte ni les invitations, ni les appareils, ni les jetons de notification.</p><div class="notice">Ouvre cet outil dans le même navigateur où ton profil Igor est déjà lié à la production.</div><button id="go" class="btn">Télécharger la copie TEST</button><p id="msg" class="muted"></p></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {getFirestore,collection,getDocs,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyB3PFq_lZZKyB4psesMmqB7vKEnVH1ASUM',authDomain:'team-tool-data.firebaseapp.com',projectId:'team-tool-data',storageBucket:'team-tool-data.firebasestorage.app',messagingSenderId:'994222139729',appId:'1:994222139729:web:79ac2f43b7a8e02be6cb70'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);const msg=document.getElementById('msg');const cols=['profiles','availability','legacyStatus','compatibilities','plans','tripDays','preferences'];
function dl(data){const blob=new Blob([JSON.stringify(data,(k,v)=>v?.toDate?v.toDate().toISOString():v,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Covoiturage_TEST_snapshot_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
document.getElementById('go').onclick=async()=>{try{if(!auth.currentUser)throw new Error('Ce navigateur n’est pas connecté à la production. Ouvre d’abord Covoiturage avec ton lien Igor.');const link=await getDoc(doc(db,'deviceLinks',auth.currentUser.uid));if(!link.exists()||link.data().profileId!=='igor')throw new Error('Cet appareil n’est pas lié au profil Igor.');msg.textContent='Export en cours…';const out={schema:1,exportedAt:new Date().toISOString(),collections:{}};for(const c of cols){const snap=await getDocs(collection(db,c));out.collections[c]=snap.docs.map(d=>({id:d.id,data:d.data()}));}const cal=await getDoc(doc(db,'config','calendar'));out.calendar=cal.exists()?cal.data():{exceptions:[]};dl(out);msg.textContent='Copie téléchargée.';}catch(e){msg.textContent=e.message;}};
</script></body></html>
