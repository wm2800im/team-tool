name: Promote history balance PROD 4.8.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-history-balance-4.8.1.yml'

permissions:
  contents: write

jobs:
  promote-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote exact validated TEST beta8 UI and CSV
        shell: bash
        run: |
          set -euo pipefail
          TEST_SHA='0e6a730b4ae8cbf49a29ce1ad6fffbe8205159c7'
          BASE="https://raw.githubusercontent.com/wm2800im/team-tool-test/${TEST_SHA}"
          curl -fsSL --retry 3 "$BASE/app.js" -o /tmp/app.test.js
          curl -fsSL --retry 3 "$BASE/index.html" -o /tmp/index.test.html
          curl -fsSL --retry 3 "$BASE/styles.css" -o /tmp/styles.test.css

          python3 - <<'PY'
          from pathlib import Path

          app=Path('/tmp/app.test.js').read_text(encoding='utf-8')
          marker="const APP_VERSION = ENV.version || '4.8.0-beta.8';"
          if app.count(marker)!=1:
              raise SystemExit('Version TEST beta8 inattendue')
          app=app.replace(marker,"const APP_VERSION = ENV.version || '4.8.1';",1)
          Path('app.js').write_text(app,encoding='utf-8')

          Path('index.html').write_text(Path('/tmp/index.test.html').read_text(encoding='utf-8'),encoding='utf-8')
          Path('styles.css').write_text(Path('/tmp/styles.test.css').read_text(encoding='utf-8'),encoding='utf-8')

          cfg_path=Path('public-config.js')
          cfg=cfg_path.read_text(encoding='utf-8')
          if cfg.count('version: "4.8.0"')!=1:
              raise SystemExit('Version PROD de départ inattendue')
          cfg=cfg.replace('version: "4.8.0"','version: "4.8.1"',1)
          cfg_path.write_text(cfg,encoding='utf-8')

          sw_path=Path('service-worker.js')
          sw=sw_path.read_text(encoding='utf-8')
          if sw.count("const CACHE='covoiturage-4.8.0';")!=1:
              raise SystemExit('Cache PROD de départ inattendu')
          sw=sw.replace("const CACHE='covoiturage-4.8.0';","const CACHE='covoiturage-4.8.1';",1)
          sw_path.write_text(sw,encoding='utf-8')
          PY

      - name: Syntax and whitespace checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check quota-core.mjs
          node --check public-config.js
          node --check service-worker.js
          node --check notify-runner.mjs
          git diff --check

      - name: Existing quota-safe regression suite
        run: node --test tests/quota-core.test.mjs

      - name: Verify CSV global summary and instant group filter
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');

          assert(html.includes('id="groupBalanceFilter"'));
          assert(html.includes('id="groupBalanceList"'));
          assert(html.includes('id="groupBalanceCount"'));
          assert(app.includes("groupBalanceFilter')?.addEventListener('input'"));
          assert(app.includes('BILAN GLOBAL DES COMPTEURS ACTUELS'));
          assert(app.includes("['Groupe',...PEOPLE.map(label)]"));
          assert(app.includes("toast('Historique exporté avec le bilan global des compteurs.')"));
          for(const cls of ['group-balance-grid','group-balance-card','group-balance-search']) assert(css.includes('.'+cls));

          const PEOPLE=['aurelien','etienne','igor','ludo','stephane'];
          const INITIAL={aurelien:'A',etienne:'E',igor:'I',ludo:'L',stephane:'S'};
          const block=app.match(/function groupBalanceFilterLetters\(value\)\{[\s\S]*?\n\}\nfunction groupBalanceMatches\(code,value\)\{[\s\S]*?\n\}/);
          assert(block,'fonctions de filtre introuvables');
          eval(block[0]);
          assert.deepEqual(groupBalanceFilterLetters('i a l'),['I','A','L']);
          assert.deepEqual(groupBalanceFilterLetters('iil'),['I','L']);
          assert.equal(groupBalanceMatches('AIL','IAL'),true);
          assert.equal(groupBalanceMatches('AILS','IAL'),true);
          assert.equal(groupBalanceMatches('AEIL','IAL'),true);
          assert.equal(groupBalanceMatches('ILS','IAL'),false);
          assert.equal(groupBalanceMatches('AEIS','I'),true);
          assert.equal(groupBalanceMatches('AEL','I'),false);

          const canonical=arr=>[...new Set(arr)].sort();
          const counterBlock=app.match(/function buildCurrentGroupCounters\(trips\)\{[\s\S]*?\n\}/);
          assert(counterBlock,'calcul compteurs introuvable');
          eval(counterBlock[0]);
          const trips=[
            {participants:['etienne','igor','ludo'],driver:'etienne'},
            {participants:['igor','ludo','etienne'],driver:'igor'},
            {participants:['ludo','etienne','igor'],driver:'ludo'},
            {participants:['igor','ludo','etienne'],driver:'igor'},
            {participants:['etienne','aurelien','stephane'],driver:'stephane'},
            {participants:['aurelien','stephane','etienne'],driver:'aurelien'}
          ];
          const c=buildCurrentGroupCounters(trips);
          assert.deepEqual(c.get('etienne|igor|ludo'),{etienne:1,igor:2,ludo:1});
          assert.deepEqual(c.get('aurelien|etienne|stephane'),{aurelien:1,etienne:0,stephane:1});
          console.log('CSV + filtre bilan groupes: OK');
          NODE

      - name: Verify production invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          cfg=Path('public-config.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'prod environment':'environment: "production"' in cfg,
            'prod version':'version: "4.8.1"' in cfg,
            'prod project':'projectId: "team-tool-data"' in cfg,
            'no TEST project':'team-tool-test-data' not in cfg+app+html,
            'prod VAPID preserved':'BDY_aON4z7uM561jtiX4WeQ7cWbagvuA0M7eP1c_b540_bXALoiwGEAsSvqVMWJwsRM5Jll6Gx6PwqX3eLleVSE' in cfg,
            'app prod fallback':"APP_VERSION = ENV.version || '4.8.1'" in app,
            'quota-safe preserved':'persistentLocalCache' in app and 'selectFreshBaseline' in app,
            'Delle preserved':'Covoiturage jusqu’à Delle' in app,
            'notification UX preserved':'Test envoyé. Vérifie la notification sur cet appareil.' in app,
            'group search present':'groupBalanceFilter' in app and 'groupBalanceFilter' in html,
            'CSV global summary':'BILAN GLOBAL DES COMPTEURS ACTUELS' in app,
            'service worker cache':"const CACHE='covoiturage-4.8.1'" in sw,
            'help injection preserved':'Aide express de production' in cfg,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK  ' if v else 'FAIL')+k)
          if failed: raise SystemExit('Contrôles PROD échoués: '+', '.join(failed))
          PY

      - name: Commit production 4.8.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css public-config.js service-worker.js
          git commit -m 'feat(prod): searchable group balance and CSV summary 4.8.1'
          git push origin HEAD:main

      - name: Smoke test deployed GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://wm2800im.github.io/team-tool'
          ok=0
          for i in $(seq 1 30); do
            stamp=$(date +%s)
            if curl -fsSL --max-time 15 "$BASE/public-config.js?v=$stamp" -o /tmp/live-config.js \
              && curl -fsSL --max-time 15 "$BASE/app.js?v=$stamp" -o /tmp/live-app.js \
              && curl -fsSL --max-time 15 "$BASE/index.html?v=$stamp" -o /tmp/live-index.html \
              && curl -fsSL --max-time 15 "$BASE/styles.css?v=$stamp" -o /tmp/live-styles.css \
              && curl -fsSL --max-time 15 "$BASE/service-worker.js?v=$stamp" -o /tmp/live-sw.js \
              && grep -q 'version: "4.8.1"' /tmp/live-config.js \
              && grep -q 'projectId: "team-tool-data"' /tmp/live-config.js \
              && ! grep -q 'team-tool-test-data' /tmp/live-config.js \
              && grep -q 'groupBalanceFilter' /tmp/live-app.js \
              && grep -q 'BILAN GLOBAL DES COMPTEURS ACTUELS' /tmp/live-app.js \
              && grep -q 'id="groupBalanceFilter"' /tmp/live-index.html \
              && grep -q 'group-balance-search' /tmp/live-styles.css \
              && grep -q "covoiturage-4.8.1" /tmp/live-sw.js; then
                ok=1; break
            fi
            echo "Pages pas encore à jour (tentative $i/30)"
            sleep 10
          done
          test "$ok" = 1
          echo 'Smoke test PROD 4.8.1: OK'
