name: Deploy tested 4.7.0 to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-tested-4.7.0.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import the exact TEST code validated by Igor
        shell: bash
        run: |
          set -euo pipefail
          TEST_SHA='58b89c6be93f6d4d12acbf17df9295500eed86df'
          BASE="https://raw.githubusercontent.com/wm2800im/team-tool-test/${TEST_SHA}"
          curl -fL --retry 3 --retry-delay 2 "$BASE/app.js" -o app.js
          curl -fL --retry 3 --retry-delay 2 "$BASE/styles.css" -o styles.css
          curl -fL --retry 3 --retry-delay 2 "$BASE/notify-runner.mjs" -o notify-runner.mjs

      - name: Keep PROD configuration and set production version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const APP_VERSION = ENV.version || '4.6.0-beta.2';","const APP_VERSION = ENV.version || '4.7.0';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('public-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('version: "4.6.0"','version: "4.7.0"',1)
          if 'environment: "production"' not in s:
              raise SystemExit('PROD environment marker missing')
          if 'projectId: "team-tool-data"' not in s:
              raise SystemExit('PROD Firebase project missing')
          if 'team-tool-test-data' in s:
              raise SystemExit('TEST Firebase project leaked into PROD config')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          import re
          s,n=re.subn(r"const CACHE='covoiturage-[^']+';","const CACHE='covoiturage-4.7.0';",s,count=1)
          if n!=1:
              raise SystemExit('service-worker cache marker not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static syntax and production safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
          node --check notify-runner.mjs
          git diff --check

          grep -q 'environment: "production"' public-config.js
          grep -q 'projectId: "team-tool-data"' public-config.js
          grep -q 'version: "4.7.0"' public-config.js
          grep -q "const CACHE='covoiturage-4.7.0'" service-worker.js
          ! grep -q 'team-tool-test-data' public-config.js

          # Notifications par appareil : réparation FCM, message neutre iPhone/Android.
          grep -q 'notificationRepairInFlight' app.js
          grep -q 'Notifications bloquées sur cet appareil' app.js
          grep -q 'Test envoyé. Vérifie la notification sur cet appareil.' app.js
          ! grep -q 'Vérifie la notification Android' app.js

          # Delle : rendu harmonisé et distinction jaune pâle.
          grep -q 'Covoiturage jusqu’à Delle' app.js
          grep -q 'delle-proposal-shell' styles.css
          grep -q '#fff8e7' styles.css
          grep -q 'z-index:260' styles.css

          # Rappel 20 h robuste : fenêtre de rattrapage et retry.
          grep -q 'now.hour<20 || now.hour>22' notify-runner.mjs
          grep -q "status:'retry'" notify-runner.mjs
          grep -q "status:'sent'" notify-runner.mjs

      - name: Verify no accidental TEST UI/config was promoted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path('public-config.js').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          checks={
            'prod_environment':'environment: "production"' in cfg,
            'prod_project':'projectId: "team-tool-data"' in cfg,
            'prod_version':'version: "4.7.0"' in cfg,
            'test_project_absent':'team-tool-test-data' not in cfg,
            'test_mode_runtime_guarded':"const IS_TEST = ENV.environment === 'test';" in app,
            'delle_private_logic':'isDelleViewer' in app and 'subscribeDellePrivate' in app,
            'notification_autorepair':'repairNotificationRegistration' in app,
          }
          bad=[k for k,v in checks.items() if not v]
          print('\n'.join(f'{k}: {"OK" if v else "FAIL"}' for k,v in checks.items()))
          if bad:
              raise SystemExit('Safety checks failed: '+', '.join(bad))
          PY

      - name: Commit production 4.7.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css public-config.js service-worker.js notify-runner.mjs
          git diff --cached --stat
          git commit -m 'release: production 4.7.0 from validated TEST beta8'
          git push origin HEAD:main
