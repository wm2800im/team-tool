name: Promote production 4.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-4.4.2.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote validated beta.14
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/app.js -o app.js
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/index.html -o index.html
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/styles.css -o styles.css

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1), encoding='utf-8')

          replace_once('app.js', "const APP_VERSION = ENV.version || '4.4.0-beta.14';", "const APP_VERSION = ENV.version || '4.4.2';")
          replace_once('public-config.js', 'version: "4.4.1"', 'version: "4.4.2"')
          replace_once('service-worker.js', "const CACHE='covoiturage-4.4.1';", "const CACHE='covoiturage-4.4.2';")

          config=Path('public-config.js').read_text(encoding='utf-8')
          required=[
              'environment: "production"',
              'projectId: "team-tool-data"',
              'authDomain: "team-tool-data.firebaseapp.com"',
              'version: "4.4.2"'
          ]
          for needle in required:
              if needle not in config:
                  raise SystemExit(f'Production config guard failed: missing {needle}')
          if 'team-tool-test-data' in config:
              raise SystemExit('TEST Firebase configuration detected in production config')

          app=Path('app.js').read_text(encoding='utf-8')
          for needle in [
              "const APP_VERSION = ENV.version || '4.4.2';",
              'function previousWorkingDayISO(ds)',
              'const ds=previousWorkingDayISO(nextCarpoolISO());',
              'function openUnvalidatedTrip(ds)',
              "qsa('.group-check:checked:not(:disabled)')"
          ]:
              if needle not in app:
                  raise SystemExit(f'app.js guard failed: missing {needle}')
          if 'for(let i=0;i<10' in app:
              raise SystemExit('Old multi-day reminder scan detected')

          sw=Path('service-worker.js').read_text(encoding='utf-8')
          if "const CACHE='covoiturage-4.4.2';" not in sw:
              raise SystemExit('Service worker version guard failed')
          PY

          node --check app.js
          git diff --check

      - name: Commit production 4.4.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css public-config.js service-worker.js
          git commit -m "release: production 4.4.2"
          git rm .github/workflows/promote-4.4.2.yml
          git commit --amend --no-edit
          git push origin HEAD:main
