name: Apply PROD 4.5.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated TEST sources
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/app.js -o /tmp/test_app.js
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/public-config.js -o /tmp/test_public_config.js
      - name: Patch production app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          VERSION='4.5.0'
          def block(src,start,end):
              i=src.find(start); j=src.find(end,i)
              if i<0 or j<0: raise SystemExit(f'block not found: {start}')
              return src[i:j]
          def replace_block(dst,start,end,repl):
              i=dst.find(start); j=dst.find(end,i)
              if i<0 or j<0: raise SystemExit(f'prod block not found: {start}')
              return dst[:i]+repl+dst[j:]

          # app.js : on conserve toutes les corrections spécifiques PROD et on importe
          # uniquement les blocs validés sur TEST pour les actions par groupe.
          p=Path('app.js'); prod=p.read_text(encoding='utf-8'); test=Path('/tmp/test_app.js').read_text(encoding='utf-8')
          prod=prod.replace('getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, writeBatch,\n  onSnapshot, serverTimestamp',
                            'getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, writeBatch, runTransaction,\n  onSnapshot, serverTimestamp',1)
          prod=prod.replace("const APP_VERSION = ENV.version || '4.4.4';",f"const APP_VERSION = ENV.version || '{VERSION}';",1)
          if 'let editingGroupId = null;' not in prod:
              marker='let accessUiInitialized = false;\n'
              if marker not in prod: raise SystemExit('editing state marker missing')
              prod=prod.replace(marker,marker+'let editingGroupId = null;\nlet editingGroupDate = null;\n',1)

          spans=[
              ('function renderGroups(){','function renderGroupCompatibilityMessage(ds){'),
              ('async function addSelectedGroup(){','async function savePlan(date,groups){'),
              ('function renderDraftGroups(ds){','function loadValidatedIntoPlan(date){'),
              ('function normalizedGroupSignature(groups){','async function validateGroupsForDate(ds,groups){'),
          ]
          for start,end in spans:
              prod=replace_block(prod,start,end,block(test,start,end))
          p.write_text(prod,encoding='utf-8')

          # index : emplacement de l'aide dans le menu.
          p=Path('index.html'); html=p.read_text(encoding='utf-8')
          if 'help-menu-block' not in html:
              marker='  <div id="adminMenuBlock" class="settings-block" style="display:none"><button id="openAdminBtn" class="btn secondary full">Administration</button></div>'
              if marker not in html: raise SystemExit('help insertion marker missing')
              html=html.replace(marker,'  <div class="settings-block help-menu-block"></div>\n'+marker,1)
          p.write_text(html,encoding='utf-8')

          # styles : boutons Valider / Modifier par groupe + focus de l'éditeur.
          p=Path('styles.css'); css=p.read_text(encoding='utf-8')
          if '/* 4.5.0 — actions indépendantes par groupe */' not in css:
              css+='''\n\n/* 4.5.0 — actions indépendantes par groupe */\n.quick-group-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}\n.quick-group-actions .btn{flex:1 1 145px}\n.group-card-focus{outline:3px solid var(--brand);outline-offset:2px;box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 12%,transparent)}\n@media(max-width:620px){.quick-group-actions{gap:6px}.quick-group-actions .btn{font-size:11.5px;min-height:38px;padding:8px 7px}}\n'''
          p.write_text(css,encoding='utf-8')

          # Aide express : même version visuelle validée sur TEST, sans la mention TEST.
          p=Path('public-config.js'); cfg=p.read_text(encoding='utf-8')
          cfg=cfg.replace('version: "4.4.4"',f'version: "{VERSION}"',1)
          if 'help-summary-text' not in cfg:
              th=Path('/tmp/test_public_config.js').read_text(encoding='utf-8')
              start=th.find('// Aide visuelle réservée à la plateforme TEST.')
              if start<0: raise SystemExit('TEST help block missing')
              helpcode=th[start:]
              helpcode=helpcode.replace('// Aide visuelle réservée à la plateforme TEST.','// Aide express de production.')
              helpcode=helpcode.replace('test-help-styles','prod-help-styles')
              # La garde document est essentielle : public-config.js est aussi chargé par le service worker FCM.
              helpcode=helpcode.replace('      .help-test-note{padding:10px 14px;background:#f7efff;border-top:1px solid #e4d1f5;color:#6a1fa1;font-size:11px;line-height:1.4}\n','')
              helpcode=helpcode.replace('      html[data-theme="dark"] .help-test-note{background:#25172e;border-color:#4c2d5f;color:#d8a9f5}\n','')
              helpcode=helpcode.replace('        <div class="help-test-note"><strong>🧪 Version TEST :</strong> la validation est volontairement libre afin de pouvoir faire des démonstrations sans attendre l’heure réelle.</div>\n','')
              cfg=cfg.rstrip()+"\n\n"+helpcode
          p.write_text(cfg,encoding='utf-8')

          Path('CHANGEMENTS_4.5.0.md').write_text('''# Covoiturage 4.5.0\n\n- Validation indépendante de chaque groupe quand plusieurs groupes sont proposés.\n- Modification ciblée d’un groupe sans toucher aux autres groupes.\n- Écriture Firestore transactionnelle pour éviter l’écrasement d’une autre validation.\n- Aide express visuelle ajoutée en production.\n- Typographie du bouton Aide express alignée sur le reste du menu.\n''',encoding='utf-8')

          # Contrôles statiques avant publication.
          src=Path('app.js').read_text(encoding='utf-8')
          for token in ['runTransaction','validateSingleGroupForDate','quick-modify-one','editingGroupId',"ENV.version || '4.5.0'"]:
              if token not in src: raise SystemExit(f'missing app token: {token}')
          pc=Path('public-config.js').read_text(encoding='utf-8')
          for token in ['version: "4.5.0"','Aide express',"typeof document !== 'undefined'"]:
              if token not in pc: raise SystemExit(f'missing config token: {token}')
          if 'Version TEST' in pc: raise SystemExit('TEST wording leaked into production help')
          print('PROD 4.5.0 ready')
          PY
      - name: Syntax check
        shell: bash
        run: |
          node --check app.js
          node --check public-config.js
      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html public-config.js CHANGEMENTS_4.5.0.md
          git commit -m "feat(prod): release 4.5.0 with per-group actions and help"
          git push
