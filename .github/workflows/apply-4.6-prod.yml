name: Apply 4.6.0 Delle production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-4.6-prod.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring tested 4.6 logic from TEST
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/app.js -o app.js
          curl -fsSL https://raw.githubusercontent.com/wm2800im/team-tool-test/main/styles.css -o styles.css
          python3 - <<'PY'
          from pathlib import Path

          # app.js: same code tested on TEST, but production version label.
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const APP_VERSION = ENV.version || '4.6.0-beta.2';"
          if s.count(old)!=1:
              raise SystemExit(f'app.js version marker: expected 1, got {s.count(old)}')
          s=s.replace(old,"const APP_VERSION = ENV.version || '4.6.0';",1)
          required=[
              "function lastDrivingDateBefore(ds,pid)",
              "// DELLE_PRIVATE_START",
              "function saveHistoricalDelleTrip(ds,driver)",
              "function subscribeDellePrivate()",
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'missing tested feature marker: {marker}')
          p.write_text(s,encoding='utf-8')

          # Production page: add the private Delle host, without replacing production help markup.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="dellePrivate"' not in s:
              old='    <div id="quickProposal" class="quick-proposal proposal-bottom"></div>'
              new=old+'\n    <div id="dellePrivate" class="delle-private" style="display:none"></div>'
              if s.count(old)!=1:
                  raise SystemExit('index Delle insertion marker not found uniquely')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Keep PROD Firebase/VAPID configuration; only bump the release version.
          p=Path('public-config.js')
          s=p.read_text(encoding='utf-8')
          if 'environment: "production"' not in s or 'projectId: "team-tool-data"' not in s:
              raise SystemExit('refusing release: production Firebase config guard failed')
          if 'version: "4.5.0"' in s:
              s=s.replace('version: "4.5.0"','version: "4.6.0"',1)
          elif 'version: "4.6.0"' not in s:
              raise SystemExit('public-config version marker unexpected')
          p.write_text(s,encoding='utf-8')

          # Force installed PWAs to refresh the shell.
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          import re
          s,n=re.subn(r"const CACHE='covoiturage-[^']+';","const CACHE='covoiturage-4.6.0';",s,count=1)
          if n!=1:
              raise SystemExit('service-worker cache marker not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate production release
        shell: bash
        run: |
          node --check app.js
          grep -q 'environment: "production"' public-config.js
          grep -q 'projectId: "team-tool-data"' public-config.js
          grep -q 'version: "4.6.0"' public-config.js
          grep -q 'id="dellePrivate"' index.html
          grep -q 'DELLE_PRIVATE_START' app.js
          grep -q 'saveHistoricalDelleTrip' app.js
          grep -q 'lastDrivingDateBefore' app.js

      - name: Commit production 4.6.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html public-config.js service-worker.js
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "feat(prod): release Delle rotation and fair driver tie-break 4.6.0"
          git push origin HEAD:main
