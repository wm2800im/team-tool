name: Promote production 4.4.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-4.4.3.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote validated beta.15
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request

          TEST_SHA='259d0c3823d8ab537f40f74efe12f372a207922d'
          url=f'https://raw.githubusercontent.com/wm2800im/team-tool-test/{TEST_SHA}/app.js'
          test_app=urllib.request.urlopen(url, timeout=30).read().decode('utf-8')
          if "const APP_VERSION = ENV.version || '4.4.0-beta.15';" not in test_app:
              raise SystemExit('Validated TEST marker beta.15 missing')
          prod_app=test_app.replace("const APP_VERSION = ENV.version || '4.4.0-beta.15';", "const APP_VERSION = ENV.version || '4.4.3';", 1)
          if 'team-tool-test-data' in prod_app:
              raise SystemExit('TEST Firebase reference unexpectedly present in app.js')
          Path('app.js').write_text(prod_app,encoding='utf-8')

          cfgp=Path('public-config.js')
          cfg=cfgp.read_text(encoding='utf-8')
          if cfg.count('version: "4.4.2"') != 1:
              raise SystemExit('Expected production version 4.4.2 exactly once')
          cfg=cfg.replace('version: "4.4.2"','version: "4.4.3"',1)
          if 'environment: "production"' not in cfg or 'projectId: "team-tool-data"' not in cfg or 'team-tool-test-data' in cfg:
              raise SystemExit('Production Firebase configuration guard failed')
          cfgp.write_text(cfg,encoding='utf-8')

          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          if sw.count("const CACHE='covoiturage-4.4.2';") != 1:
              raise SystemExit('Expected production cache 4.4.2 exactly once')
          sw=sw.replace("const CACHE='covoiturage-4.4.2';","const CACHE='covoiturage-4.4.3';",1)
          swp.write_text(sw,encoding='utf-8')

          app=Path('app.js').read_text(encoding='utf-8')
          checks=[
              ('prod app version', "const APP_VERSION = ENV.version || '4.4.3';" in app),
              ('one tripDays listener', app.count("watch('tripDays',collection(db,'tripDays')") == 1),
              ('tripDays early load', "watch('tripDays',collection(db,'tripDays')" in app.split("watch('profiles',collection(db,'profiles')")[0]),
              ('legacy deferred only', "const begin=()=>{\n      watch('legacyStatus'" in app),
              ('notification test available in prod', "const canTestNotifications=profileId===linkedProfileId&&np.notificationsEnabled;" in app),
              ('FCM token remains test-only', "copyTokenBtn.style.display=(IS_TEST&&canTestNotifications)?'inline-flex':'none'" in app),
              ('prod notification title', "IS_TEST?'Covoiturage · TEST':'Covoiturage'" in app),
              ('no old notification gate', "IS_TEST&&profileId===linkedProfileId&&np.notificationsEnabled)?'flex':'none'" not in app),
          ]
          failed=[name for name,ok in checks if not ok]
          if failed:
              raise SystemExit('Failed checks: '+', '.join(failed))

          expected=test_app.replace("const APP_VERSION = ENV.version || '4.4.0-beta.15';", "const APP_VERSION = ENV.version || '4.4.3';", 1)
          if app != expected:
              raise SystemExit('Production app.js differs from validated TEST beyond version marker')
          PY
          node --check app.js
          git diff --check

      - name: Commit production 4.4.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js public-config.js service-worker.js
          git commit -m "release: production 4.4.3"
          git rm .github/workflows/promote-4.4.3.yml
          git commit --amend --no-edit
          git push origin HEAD:main
