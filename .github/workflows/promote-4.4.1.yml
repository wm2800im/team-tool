name: Promote production 4.4.1

on:
  push:
    paths:
      - '.github/workflows/promote-4.4.1.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote validated beta.11 code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          def download(url):
              return urlopen(url, timeout=30).read().decode('utf-8')

          app = download('https://raw.githubusercontent.com/wm2800im/team-tool-test/main/app.js')
          index = download('https://raw.githubusercontent.com/wm2800im/team-tool-test/main/index.html')

          if "4.4.0-beta.11" not in app:
              raise SystemExit('Expected beta.11 marker missing from test app.js')
          app = app.replace("4.4.0-beta.11", "4.4.1")
          Path('app.js').write_text(app, encoding='utf-8')
          Path('index.html').write_text(index, encoding='utf-8')

          cfg_path = Path('public-config.js')
          cfg = cfg_path.read_text(encoding='utf-8')
          if 'environment: "production"' not in cfg or 'team-tool-data.firebaseapp.com' not in cfg:
              raise SystemExit('Production Firebase config guard failed')
          if 'team-tool-test-data' in cfg:
              raise SystemExit('Test Firebase identifier detected in production config')
          if 'version: "4.4.0"' not in cfg:
              raise SystemExit('Expected production version 4.4.0 missing')
          cfg = cfg.replace('version: "4.4.0"', 'version: "4.4.1"', 1)
          cfg_path.write_text(cfg, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          if "covoiturage-4.4.0" not in sw:
              raise SystemExit('Expected production cache 4.4.0 missing')
          sw = sw.replace('covoiturage-4.4.0', 'covoiturage-4.4.1', 1)
          sw_path.write_text(sw, encoding='utf-8')

          checks = [
              ('app.js', "APP_VERSION = ENV.version || '4.4.1'"),
              ('app.js', "const timeLabel = value => value===LATE_UNKNOWN ? '?'"),
              ('index.html', '<label>Départ</label><select id="timeLimit">'),
              ('public-config.js', 'version: "4.4.1"'),
              ('service-worker.js', "covoiturage-4.4.1"),
          ]
          for fn, needle in checks:
              if needle not in Path(fn).read_text(encoding='utf-8'):
                  raise SystemExit(f'Missing expected marker in {fn}: {needle}')
          PY
          node --check app.js
          if grep -q 'team-tool-test-data' public-config.js; then echo 'TEST Firebase config detected' && exit 1; fi
      - name: Commit production release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html public-config.js service-worker.js
          git diff --cached --check
          git commit -m 'release: production 4.4.1'
          git push origin main
